name: iOS 1.6.3 Signed IPA Build

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type BUILD_IOS_1_6_3_29 to build the signed iOS 1.6.3 (29) IPA.'
        required: true

permissions:
  contents: read

concurrency:
  group: ios-1.6.3-build29
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ inputs.confirm_release == 'BUILD_IOS_1_6_3_29' }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: private-source-read
    env:
      MOBILE_REF: release/ios/1.6.3
      SHARED_TYPES_REF: main
      EXPECTED_MOBILE_SHA: b637c07e1e826f7ab6eab3d4c93e75f2d06ab3f0
      DEVELOPMENT_TEAM: 5522X6YM63

    steps:
      - name: Checkout broker workflow helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create read-only installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MOBILE_BUILD_BROKER_APP_ID }}
          private-key: ${{ secrets.MOBILE_BUILD_BROKER_APP_KEY }}
          owner: hacom-holding-dx
          repositories: |
            chat-mobile-client
            chat-shared-types
          skip-token-revoke: true

      - name: Checkout fixed private source and revoke token
        env:
          INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          private_root="$RUNNER_TEMP/private-source"
          mkdir -p "$private_root"
          token_revoked=false
          revoke_token() {
            if [ "$token_revoked" = false ]; then
              curl --fail --silent --request DELETE \
                --header "Authorization: Bearer $INSTALLATION_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                https://api.github.com/installation/token >/dev/null 2>&1 || true
            fi
          }
          trap revoke_token EXIT
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$INSTALLATION_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="$auth_header" clone --quiet --depth 10 --single-branch --no-tags --branch "$MOBILE_REF" \
            https://github.com/hacom-holding-dx/chat-mobile-client.git "$private_root/chat-mobile-client"
          git -c http.extraHeader="$auth_header" clone --quiet --depth 1 --single-branch --no-tags --branch "$SHARED_TYPES_REF" \
            https://github.com/hacom-holding-dx/chat-shared-types.git "$private_root/chat-shared-types"
          git -C "$private_root/chat-mobile-client" checkout --quiet --detach "$EXPECTED_MOBILE_SHA"
          MOBILE_SHA="$(git -C "$private_root/chat-mobile-client" rev-parse HEAD)"
          test "$MOBILE_SHA" = "$EXPECTED_MOBILE_SHA"
          curl --fail --silent --request DELETE \
            --header "Authorization: Bearer $INSTALLATION_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/installation/token
          token_revoked=true
          trap - EXIT
          rm -rf -- "$private_root/chat-mobile-client/.git" "$private_root/chat-shared-types/.git"
          echo "PRIVATE_ROOT=$private_root" >> "$GITHUB_ENV"
          echo "MOBILE_SHA=$MOBILE_SHA" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: false

      - name: Select Xcode 26
        shell: bash
        run: |
          set -Eeuo pipefail
          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          test -n "$xcode_app"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install and test private source
        shell: bash
        run: |
          set -Eeuo pipefail
          mobile="$PRIVATE_ROOT/chat-mobile-client"
          shared="$PRIVATE_ROOT/chat-shared-types"
          npm --prefix "$shared" ci --no-audit --no-fund
          npm --prefix "$shared" run build
          cp "$mobile/.env.example" "$mobile/.env"
          npm --prefix "$mobile" ci --no-audit --no-fund
          npm --prefix "$mobile" run typecheck
          npm --prefix "$mobile" test -- --runInBand
          cd "$mobile"
          BUNDLE_GEMFILE="$mobile/Gemfile" bundle install --jobs 4 --retry 3
          BUNDLE_GEMFILE="$mobile/Gemfile" bundle exec pod install --project-directory=ios --deployment

      - name: Materialize read-only App Store Connect audit key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          ASC_KEY_DIR="$RUNNER_TEMP/asc-key"
          mkdir -p "$ASC_KEY_DIR"
          chmod 700 "$ASC_KEY_DIR"
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_DIR=$ASC_KEY_DIR" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Read Apple signing inventory before archive
        shell: bash
        run: |
          set -Eeuo pipefail
          node .github/scripts/audit-apple-signing-assets.mjs "$RUNNER_TEMP/apple-signing-before.json"

      - name: Require and install existing distribution signing assets
        env:
          DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DISTRIBUTION_P12_BASE64" || { echo 'Missing protected secret IOS_DISTRIBUTION_P12_BASE64'; exit 1; }
          test -n "$P12_PASSWORD" || { echo 'Missing protected secret IOS_DISTRIBUTION_P12_PASSWORD'; exit 1; }
          test -n "$APP_PROFILE_BASE64" || { echo 'Missing protected secret IOS_APP_STORE_PROFILE_BASE64'; exit 1; }
          test -n "$SHARE_PROFILE_BASE64" || { echo 'Missing protected secret IOS_SHARE_EXTENSION_PROFILE_BASE64'; exit 1; }

          SIGNING_ROOT="$RUNNER_TEMP/manual-signing"
          KEYCHAIN_PATH="$RUNNER_TEMP/manual-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          mkdir -p "$SIGNING_ROOT" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$DISTRIBUTION_P12_BASE64" | openssl base64 -d -A > "$SIGNING_ROOT/distribution.p12"
          printf '%s' "$APP_PROFILE_BASE64" | openssl base64 -d -A > "$SIGNING_ROOT/app.mobileprovision"
          printf '%s' "$SHARE_PROFILE_BASE64" | openssl base64 -d -A > "$SIGNING_ROOT/share.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_ROOT/distribution.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          test "$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Apple Distribution')" -eq 1

          openssl pkcs12 -in "$SIGNING_ROOT/distribution.p12" -clcerts -nokeys \
            -passin env:P12_PASSWORD -out "$SIGNING_ROOT/distribution.pem"
          openssl x509 -in "$SIGNING_ROOT/distribution.pem" -checkend 0 -noout
          CERT_NAME="$(openssl x509 -in "$SIGNING_ROOT/distribution.pem" -noout -subject -nameopt RFC2253 | sed -n 's/^subject=.*CN=\([^,]*\).*$/\1/p')"
          test -n "$CERT_NAME"
          case "$CERT_NAME" in Apple\ Distribution:*) ;; *) echo 'Signing certificate is not Apple Distribution'; exit 1 ;; esac
          CERT_EXPIRES="$(openssl x509 -in "$SIGNING_ROOT/distribution.pem" -noout -enddate | cut -d= -f2-)"
          CERT_SHA256="$(openssl x509 -in "$SIGNING_ROOT/distribution.pem" -outform DER | shasum -a 256 | cut -d ' ' -f1)"
          export CERT_SHA256 SIGNING_ROOT
          printf 'certificate\t%s\tIOS_DISTRIBUTION\t%s\n' "$CERT_NAME" "$CERT_EXPIRES"

          security cms -D -i "$SIGNING_ROOT/app.mobileprovision" > "$SIGNING_ROOT/app.plist"
          security cms -D -i "$SIGNING_ROOT/share.mobileprovision" > "$SIGNING_ROOT/share.plist"
          python3 - <<'PY'
          import datetime, hashlib, os, plistlib, shutil

          root = os.environ['SIGNING_ROOT']
          expected_cert = os.environ['CERT_SHA256']
          profile_dir = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
          expected_team = os.environ['DEVELOPMENT_TEAM']
          for stem, bundle_id, env_prefix in (
              ('app', 'com.hacom.chat', 'APP'),
              ('share', 'com.hacom.chat.share', 'SHARE'),
          ):
              with open(os.path.join(root, f'{stem}.plist'), 'rb') as handle:
                  profile = plistlib.load(handle)
              expiry = profile['ExpirationDate']
              if expiry <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
                  raise SystemExit(f'{stem} provisioning profile is expired')
              if profile.get('ProvisionedDevices') or profile.get('ProvisionsAllDevices'):
                  raise SystemExit(f'{stem} profile is not an App Store profile')
              entitlements = profile['Entitlements']
              if entitlements.get('get-task-allow') is not False:
                  raise SystemExit(f'{stem} profile permits development debugging')
              if profile['TeamIdentifier'] != [expected_team]:
                  raise SystemExit(f'{stem} profile has the wrong team')
              if entitlements.get('application-identifier') != f'{expected_team}.{bundle_id}':
                  raise SystemExit(f'{stem} profile has the wrong bundle identifier')
              fingerprints = {hashlib.sha256(cert).hexdigest() for cert in profile['DeveloperCertificates']}
              if expected_cert not in fingerprints:
                  raise SystemExit(f'{stem} profile does not contain the supplied Distribution certificate')
              name, uuid = profile['Name'], profile['UUID']
              shutil.copyfile(
                  os.path.join(root, f'{stem}.mobileprovision'),
                  os.path.join(profile_dir, f'{uuid}.mobileprovision'),
              )
              print(f'profile\t{name}\tIOS_APP_STORE\t{expiry.isoformat()}Z')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                  handle.write(f'{env_prefix}_STORE_PROFILE_NAME={name}\n{env_prefix}_PROFILE_UUID={uuid}\n')
          PY

      - name: Archive and export App Store IPA with manual signing
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PRIVATE_ROOT/chat-mobile-client"
          xcodebuild archive \
            -workspace ios/ChatMobileClient.xcworkspace \
            -scheme ChatMobileClient \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ChatMobileClient.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            APP_STORE_PROFILE_NAME="$APP_STORE_PROFILE_NAME" \
            SHARE_EXTENSION_PROFILE_NAME="$SHARE_STORE_PROFILE_NAME"
          APP_PATH="$RUNNER_TEMP/ChatMobileClient.xcarchive/Products/Applications/ChatMobileClient.app"
          test -d "$APP_PATH/PlugIns/ShareExtension.appex"
          codesign --verify --deep --strict "$APP_PATH"
          export APP_STORE_PROFILE_NAME SHARE_STORE_PROFILE_NAME DEVELOPMENT_TEAM
          python3 - <<'PY'
          import os, plistlib
          options = {
              'method': 'app-store-connect',
              'teamID': os.environ['DEVELOPMENT_TEAM'],
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {
                  'com.hacom.chat': os.environ['APP_STORE_PROFILE_NAME'],
                  'com.hacom.chat.share': os.environ['SHARE_STORE_PROFILE_NAME'],
              },
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as handle:
              plistlib.dump(options, handle)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ChatMobileClient.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify Apple signing inventory is unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          node .github/scripts/audit-apple-signing-assets.mjs "$RUNNER_TEMP/apple-signing-after.json"
          cmp "$RUNNER_TEMP/apple-signing-before.json" "$RUNNER_TEMP/apple-signing-after.json"

      - name: Validate signed IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          IPA_COUNT="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print | wc -l | tr -d '[:space:]')"
          test "$IPA_COUNT" -eq 1
          IPA_PATH="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print | head -n 1)"
          test -s "$IPA_PATH"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-check"
          MAIN_APP="$(find "$RUNNER_TEMP/ipa-check/Payload" -type d -name '*.app' -print | head -n 1)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$MAIN_APP/Info.plist")" = 'com.hacom.chat'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MAIN_APP/Info.plist")" = '1.6.3'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$MAIN_APP/Info.plist")" = '29'
          SHAREEXT_PLIST="$MAIN_APP/PlugIns/ShareExtension.appex/Info.plist"
          test -f "$SHAREEXT_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SHAREEXT_PLIST")" = 'com.hacom.chat.share'
          codesign --verify --deep --strict "$MAIN_APP"
          codesign -d --verbose=4 "$MAIN_APP" 2>&1 | grep -q '^Authority=Apple Distribution:'
          security cms -D -i "$MAIN_APP/embedded.mobileprovision" > "$RUNNER_TEMP/ipa-check/app-profile.plist"
          security cms -D -i "$MAIN_APP/PlugIns/ShareExtension.appex/embedded.mobileprovision" > "$RUNNER_TEMP/ipa-check/share-profile.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ipa-check/app-profile.plist")" = "$APP_STORE_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ipa-check/share-profile.plist")" = "$SHARE_STORE_PROFILE_NAME"
          IPA_SHA256="$(shasum -a 256 "$IPA_PATH" | cut -d ' ' -f 1)"
          {
            echo "MOBILE_SHA=$MOBILE_SHA"
            echo 'MAIN_VERSION=1.6.3'
            echo 'MAIN_BUILD=29'
            echo "IPA_SHA256=$IPA_SHA256"
            echo 'SIGNATURE_VALIDATION=PASS'
          } > "$RUNNER_TEMP/ios-release-validation.txt"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: hacom-holdings-ios-1.6.3-build29
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/ios-release-validation.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove private source and signing material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi
          if [ -n "${APP_PROFILE_UUID:-}" ]; then
            rm -f -- "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.mobileprovision"
          fi
          if [ -n "${SHARE_PROFILE_UUID:-}" ]; then
            rm -f -- "$HOME/Library/MobileDevice/Provisioning Profiles/${SHARE_PROFILE_UUID}.mobileprovision"
          fi
          rm -rf -- "$RUNNER_TEMP/private-source" "$RUNNER_TEMP/asc-key" "$RUNNER_TEMP/export" \
            "$RUNNER_TEMP/manual-signing" "$RUNNER_TEMP/ChatMobileClient.xcarchive" "$RUNNER_TEMP/ipa-check"
          rm -f -- "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/ios-release-validation.txt" \
            "$RUNNER_TEMP/apple-signing-before.json" "$RUNNER_TEMP/apple-signing-after.json"
