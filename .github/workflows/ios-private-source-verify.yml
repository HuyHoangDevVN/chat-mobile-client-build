name: iOS 1.6.3 Signed IPA Build

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type BUILD_IOS_1_6_3_29 to build the signed iOS 1.6.3 (29) IPA.'
        required: true

permissions:
  contents: read

concurrency:
  group: ios-1.6.3-build29
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ inputs.confirm_release == 'BUILD_IOS_1_6_3_29' }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: private-source-read
    env:
      MOBILE_REF: release/ios/1.6.3
      SHARED_TYPES_REF: main
      EXPECTED_MOBILE_SHA: 14a2655f7a9ac39a2d31ca222b84ba707a0879c0
      DEVELOPMENT_TEAM: 5522X6YM63

    steps:
      - name: Create read-only installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MOBILE_BUILD_BROKER_APP_ID }}
          private-key: ${{ secrets.MOBILE_BUILD_BROKER_APP_KEY }}
          owner: hacom-holding-dx
          repositories: |
            chat-mobile-client
            chat-shared-types
          skip-token-revoke: true

      - name: Checkout fixed private source and revoke token
        env:
          INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          private_root="$RUNNER_TEMP/private-source"
          mkdir -p "$private_root"
          token_revoked=false
          revoke_token() {
            if [ "$token_revoked" = false ]; then
              curl --fail --silent --request DELETE \
                --header "Authorization: Bearer $INSTALLATION_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                https://api.github.com/installation/token >/dev/null 2>&1 || true
            fi
          }
          trap revoke_token EXIT
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$INSTALLATION_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="$auth_header" clone --quiet --depth 10 --single-branch --no-tags --branch "$MOBILE_REF" \
            https://github.com/hacom-holding-dx/chat-mobile-client.git "$private_root/chat-mobile-client"
          git -c http.extraHeader="$auth_header" clone --quiet --depth 1 --single-branch --no-tags --branch "$SHARED_TYPES_REF" \
            https://github.com/hacom-holding-dx/chat-shared-types.git "$private_root/chat-shared-types"
          git -C "$private_root/chat-mobile-client" checkout --quiet --detach "$EXPECTED_MOBILE_SHA"
          MOBILE_SHA="$(git -C "$private_root/chat-mobile-client" rev-parse HEAD)"
          test "$MOBILE_SHA" = "$EXPECTED_MOBILE_SHA"
          curl --fail --silent --request DELETE \
            --header "Authorization: Bearer $INSTALLATION_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/installation/token
          token_revoked=true
          trap - EXIT
          rm -rf -- "$private_root/chat-mobile-client/.git" "$private_root/chat-shared-types/.git"
          echo "PRIVATE_ROOT=$private_root" >> "$GITHUB_ENV"
          echo "MOBILE_SHA=$MOBILE_SHA" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: false

      - name: Select Xcode 26
        shell: bash
        run: |
          set -Eeuo pipefail
          xcode_app="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          test -n "$xcode_app"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install and test private source
        shell: bash
        run: |
          set -Eeuo pipefail
          mobile="$PRIVATE_ROOT/chat-mobile-client"
          shared="$PRIVATE_ROOT/chat-shared-types"
          npm --prefix "$shared" ci --no-audit --no-fund
          npm --prefix "$shared" run build
          cp "$mobile/.env.example" "$mobile/.env"
          npm --prefix "$mobile" ci --no-audit --no-fund
          npm --prefix "$mobile" run typecheck
          npm --prefix "$mobile" test -- --runInBand
          cd "$mobile"
          BUNDLE_GEMFILE="$mobile/Gemfile" bundle install --jobs 4 --retry 3
          BUNDLE_GEMFILE="$mobile/Gemfile" bundle exec pod install --project-directory=ios --deployment

      - name: Materialize App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          ASC_KEY_DIR="$RUNNER_TEMP/asc-key"
          mkdir -p "$ASC_KEY_DIR"
          chmod 700 "$ASC_KEY_DIR"
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_DIR=$ASC_KEY_DIR" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Revoke orphaned build 28 development certificate
        env:
          ORPHANED_CERT_SHA1: 7AE3F9F543ECBCAE1517E3DB27E014B1DCE975B5
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/cert-cleanup-venv"
          "$RUNNER_TEMP/cert-cleanup-venv/bin/pip" install --quiet --disable-pip-version-check PyJWT cryptography
          "$RUNNER_TEMP/cert-cleanup-venv/bin/python" - <<'PY'
          import base64, json, os, urllib.request
          import jwt
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization

          key_path = os.path.join(os.environ['ASC_KEY_DIR'], f"AuthKey_{os.environ['ASC_KEY_ID']}.p8")
          with open(key_path, 'rb') as handle:
              private_key = serialization.load_pem_private_key(handle.read(), password=None)
          token = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'aud': 'appstoreconnect-v1', 'exp': __import__('time').time() + 600},
              private_key,
              algorithm='ES256',
              headers={'kid': os.environ['ASC_KEY_ID']},
          )
          headers = {'Authorization': f'Bearer {token}'}
          with urllib.request.urlopen(urllib.request.Request(
              'https://api.appstoreconnect.apple.com/v1/certificates?limit=200', headers=headers
          )) as response:
              certificates = json.load(response)['data']
          expected = os.environ['ORPHANED_CERT_SHA1'].upper()
          matches = []
          for certificate in certificates:
              content = certificate.get('attributes', {}).get('certificateContent')
              if not content:
                  continue
              parsed = x509.load_der_x509_certificate(base64.b64decode(content))
              if parsed.fingerprint(hashes.SHA1()).hex().upper() == expected:
                  matches.append(certificate['id'])
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one orphaned certificate, found {len(matches)}')
          request = urllib.request.Request(
              f'https://api.appstoreconnect.apple.com/v1/certificates/{matches[0]}',
              headers=headers,
              method='DELETE',
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 204:
                  raise SystemExit(f'Certificate revoke failed with HTTP {response.status}')
          print('Revoked the pinned orphaned build 28 development certificate.')
          PY

      - name: Archive and export App Store IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PRIVATE_ROOT/chat-mobile-client"
          xcodebuild archive \
            -workspace ios/ChatMobileClient.xcworkspace \
            -scheme ChatMobileClient \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ChatMobileClient.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          APP_PATH="$RUNNER_TEMP/ChatMobileClient.xcarchive/Products/Applications/ChatMobileClient.app"
          test -d "$APP_PATH/PlugIns/ShareExtension.appex"
          codesign --verify --deep --strict "$APP_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ChatMobileClient.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Validate signed IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          IPA_COUNT="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print | wc -l | tr -d '[:space:]')"
          test "$IPA_COUNT" -eq 1
          IPA_PATH="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print | head -n 1)"
          test -s "$IPA_PATH"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-check"
          MAIN_APP="$(find "$RUNNER_TEMP/ipa-check/Payload" -type d -name '*.app' -print | head -n 1)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$MAIN_APP/Info.plist")" = 'com.hacom.chat'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MAIN_APP/Info.plist")" = '1.6.3'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$MAIN_APP/Info.plist")" = '29'
          SHAREEXT_PLIST="$MAIN_APP/PlugIns/ShareExtension.appex/Info.plist"
          test -f "$SHAREEXT_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SHAREEXT_PLIST")" = 'com.hacom.chat.share'
          codesign --verify --deep --strict "$MAIN_APP"
          IPA_SHA256="$(shasum -a 256 "$IPA_PATH" | cut -d ' ' -f 1)"
          {
            echo "MOBILE_SHA=$MOBILE_SHA"
            echo 'MAIN_VERSION=1.6.3'
            echo 'MAIN_BUILD=29'
            echo "IPA_SHA256=$IPA_SHA256"
            echo 'SIGNATURE_VALIDATION=PASS'
          } > "$RUNNER_TEMP/ios-release-validation.txt"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: hacom-holdings-ios-1.6.3-build29
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/ios-release-validation.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove private source and signing material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source" "$RUNNER_TEMP/asc-key" "$RUNNER_TEMP/export" \
            "$RUNNER_TEMP/ChatMobileClient.xcarchive" "$RUNNER_TEMP/ipa-check"
          rm -f -- "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/ios-release-validation.txt"
